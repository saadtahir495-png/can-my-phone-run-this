<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Can My Phone Run This Game?</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <div class="container">
    <h1>Can My Phone Run This Game?</h1>

    <!-- Phone selector -->
    <select id="phone">
      <option value="">Select your phone</option>

      <optgroup label="Samsung">
        <option value="low">Galaxy A10</option>
        <option value="low">Galaxy A12</option>
        <option value="mid">Galaxy A32</option>
        <option value="mid">Galaxy A52</option>
        <option value="high">Galaxy S20</option>
        <option value="high">Galaxy S23</option>
      </optgroup>

      <optgroup label="Infinix">
        <option value="low">Smart 6</option>
        <option value="mid">Hot 11</option>
        <option value="mid">Note 12</option>
        <option value="high">Zero 20</option>
      </optgroup>

      <optgroup label="Xiaomi">
        <option value="low">Redmi 9A</option>
        <option value="mid">Redmi Note 11</option>
        <option value="high">Xiaomi 12</option>
      </optgroup>

      <optgroup label="iPhone">
        <option value="mid">iPhone X</option>
        <option value="high">iPhone 11</option>
        <option value="high">iPhone 14</option>
      </optgroup>
    </select>

    <!-- Search game -->
    <input
      type="text"
      id="search"
      placeholder="Search a game (e.g. Genshin Impact)"
    >

    <!-- Button -->
    <button onclick="searchGame()">Check Game</button>

    <!-- Result -->
    <div id="result"></div>
  </div>

  <!-- JavaScript (IMPORTANT: always at the end) -->
  <script src="script.js"></script>

</body>
</html>
